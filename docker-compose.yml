services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: osmreview
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: osmreview
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osmreview"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  gol:
    build: ./infra/gol
    volumes: [goldata:/data]
    environment:
      EXTRACT_URL: ${EXTRACT_URL:-https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf}
      MIRROR_UPDATE_SECONDS: ${MIRROR_UPDATE_SECONDS:-180}
      REBUILD_DAYS: ${REBUILD_DAYS:-7}
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      gol: { condition: service_started }
    volumes:
      - goldata:/data
      - ./config:/config:ro
      - ./user-rules:/rules
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:8111:8111
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/osmreview
      DB_USER: osmreview
      RULES_DIR: /rules
      REPLICATION_ENABLED: ${REPLICATION_ENABLED:-true}
    restart: unless-stopped

volumes:
  pgdata: {}
  goldata: {}
