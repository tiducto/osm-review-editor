name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Shared JS build and npm install (the server copies the iD tagging schema from node_modules)
        run: |
          ./gradlew :shared:jsBrowserProductionLibraryDistribution
          npm ci

      - name: Test (shared JVM + JS, rules, server incl. Postgres via Testcontainers)
        run: ./gradlew :shared:allTests :rules:test :server:test

      - name: Generated TS models are up to date
        run: |
          ./gradlew :shared:generateTsModels
          git diff --exit-code web/src/generated/models.ts

      - name: Web build (type-check + bundle)
        run: npm run build -w web

      - name: Web tests (Vitest)
        run: npm test -w web

      - name: Server distribution with the bundled UI
        run: ./gradlew :server:installDist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Shared JS build and npm install
        run: |
          ./gradlew :shared:jsBrowserProductionLibraryDistribution :shared:generateTsModels
          npm ci

      - name: Playwright Chromium
        run: npx -w web playwright install --with-deps chromium

      - name: Web bundle and server distribution
        run: |
          npm run build -w web
          ./gradlew :server:installDist

      - name: Pull Postgres
        run: docker pull postgres:18

      - name: End-to-end tests (Playwright, real server, Postgres in Docker)
        run: npm run e2e -w web

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
